name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, SQLite)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Tests
        run: python -m pytest -q
      - name: Task runner works (cross-platform)
        run: python scripts/dev.py --help

  postgres:
    name: tests (PostgreSQL 16 + pgvector) and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentgrid
          POSTGRES_PASSWORD: agentgrid
          POSTGRES_DB: agentgrid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentgrid" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://agentgrid:agentgrid@localhost:5432/agentgrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Migrations apply cleanly (pgvector + HNSW) and match the models
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Tests against PostgreSQL + pgvector
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://agentgrid:agentgrid@localhost:5432/agentgrid_test
        run: |
          PGPASSWORD=agentgrid psql -h localhost -U agentgrid -c "CREATE DATABASE agentgrid_test"
          PGPASSWORD=agentgrid psql -h localhost -U agentgrid -d agentgrid_test -c "CREATE EXTENSION IF NOT EXISTS vector"
          python -m pytest -q
      - name: Seed demo data (real embeddings) and run the simulation harness
        run: |
          python -m app.cli seed
          DATABASE_URL=sqlite+aiosqlite:///./sim.db REDIS_URL= python -m app.simulate

  console:
    name: admin console build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Committed build is up to date
        run: git diff --stat --exit-code -- app/static/console || echo "::warning::console build differs from the committed one; run npm run build"

  docker:
    name: docker image (linux/amd64 + linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: PRELOAD_EMBEDDINGS=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose file is valid
        run: docker compose --profile observability --profile worker config -q
