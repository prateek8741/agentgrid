# Prometheus config for the optional "observability" docker-compose profile.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: agentgrid-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
    # If METRICS_TOKEN is set on the API, add:
    # authorization:
    #   credentials: <METRICS_TOKEN>
