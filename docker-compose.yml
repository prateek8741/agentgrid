# AgentGrid - full mode (Docker Compose).
#
#   python scripts/dev.py docker-up        (or: docker compose up -d --build)
#   docker compose exec api python -m app.cli seed
#
# Memory budget (hard limits):  api 768M + postgres 512M + redis 128M + redpanda 768M  ~= 2.2 GB
# All images are multi-arch (linux/amd64 + linux/arm64): Apple Silicon, Intel and Windows (WSL2).
name: agentgrid

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentgrid
      POSTGRES_PASSWORD: agentgrid
      POSTGRES_DB: agentgrid
    # Tuned for small machines (8-12 GB laptops / 1 GB containers).
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - wal_buffers=4MB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgrid -d agentgrid"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --maxmemory
      - 100mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

  redpanda:
    # Kafka-compatible event bus, single node in dev-container mode.
    image: redpandadata/redpanda:v24.2.27
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --reserve-memory=0M
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

  api:
    build: .
    image: agentgrid-api:local
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://agentgrid:agentgrid@postgres:5432/agentgrid
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      RUN_MIGRATIONS: "true"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

volumes:
  pgdata:
  redpanda:
  model_cache:
