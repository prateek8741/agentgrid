apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgrid-api
  namespace: agentgrid
  labels: { app.kubernetes.io/name: agentgrid, app.kubernetes.io/component: api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: agentgrid, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agentgrid, app.kubernetes.io/component: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/component: api }
      containers:
        - name: api
          image: ghcr.io/your-org/agentgrid-api:0.1.0
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: agentgrid-config }
            - secretRef: { name: agentgrid-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /app/data }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: data, emptyDir: {} }
