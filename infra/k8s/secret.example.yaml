# Template only - do NOT commit real values. Create with:
#   kubectl -n agentgrid create secret generic agentgrid-secrets --from-env-file=.env.production
# or manage it with External Secrets Operator / Sealed Secrets backed by your secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: agentgrid-secrets
  namespace: agentgrid
type: Opaque
stringData:
  JWT_SECRET: "<64 random chars>"
  DATABASE_URL: "postgresql+asyncpg://agentgrid:<password>@<host>:5432/agentgrid?sslmode=require"
  REDIS_URL: "rediss://default:<password>@<host>:6379/0"
  GROQ_API_KEY: "<groq key>"
  GEMINI_API_KEY: "<gemini key>"
  WHATSAPP_APP_SECRET: "<meta app secret>"
  WHATSAPP_ACCESS_TOKEN: "<meta token>"
  METRICS_TOKEN: "<random>"
