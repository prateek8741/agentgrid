apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgrid-worker
  namespace: agentgrid
  labels: { app.kubernetes.io/name: agentgrid, app.kubernetes.io/component: worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: agentgrid, app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agentgrid, app.kubernetes.io/component: worker }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/your-org/agentgrid-api:0.1.0
          command: ["python", "-m", "app.workers"]
          envFrom:
            - configMapRef: { name: agentgrid-config }
            - secretRef: { name: agentgrid-secrets }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
