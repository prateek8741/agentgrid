[project]
name = "agentgrid"
version = "0.1.0"
description = "AgentGrid - AI-powered customer engagement & business automation platform (multi-tenant SaaS PoC)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - RFP PoC" }

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions", "frontend", "app/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RUF012", # mutable class attrs on SQLAlchemy/Pydantic models
    "S105",   # false positives on token-type string constants
    "S106",   # same, for keyword arguments (token_type="access")
    "UP046",  # keep typing.Generic for Pydantic generic models
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S603", "S607"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
